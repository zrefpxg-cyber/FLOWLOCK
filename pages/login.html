<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FLOWLOCK | เข้าสู่ระบบ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Prompt:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-page="login" data-base=".">
  <div class="auth">
    <div class="art">
      <svg class="flow" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#a855f7" stop-opacity=".9"/>
            <stop offset="1" stop-color="#4c1d95" stop-opacity=".1"/>
          </linearGradient>
        </defs>
        <path d="M-20 520C120 430 220 640 360 540S560 380 640 450"/>
        <path d="M-20 560C120 470 220 680 360 580S560 420 640 490"/>
        <path d="M-20 600C120 510 220 720 360 620S560 460 640 530"/>
        <path d="M-20 640C120 550 220 760 360 660S560 500 640 570"/>
        <path d="M-20 680C120 590 220 800 360 700S560 540 640 610"/>
        <path d="M-20 720C120 630 220 840 360 740S560 580 640 650"/>
      </svg>
      <svg class="lockwrap" viewBox="0 0 150 150" aria-hidden="true">
        <path class="ring" d="M45 68V50a30 30 0 0 1 60 0v18"/>
        <rect class="body" x="30" y="66" width="90" height="66" rx="14"/>
        <circle class="hole" cx="75" cy="94" r="7"/>
        <rect class="hole" x="72" y="98" width="6" height="16" rx="3"/>
      </svg>
      <h2 class="brand">FLOW<span>LOCK</span></h2>
      <p class="tag">เข้าถึงพื้นที่ของคุณอย่างปลอดภัย ลื่นไหลและล็อกแน่น</p>
    </div>

    <div class="side">
      <div class="card">
        <h1>เข้าสู่ระบบ</h1>
        <p class="sub">ยินดีต้อนรับกลับมา</p>

        <div id="loginMessage" class="msg" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="username">ชื่อผู้ใช้</label>
            <div class="inp">
              <input id="username" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="ชื่อผู้ใช้ของคุณ">
            </div>
          </div>

          <div class="field">
            <label for="password">รหัสผ่าน</label>
            <div class="inp pw">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="รหัสผ่าน">
              <button type="button" class="eye" id="passwordToggle">แสดง</button>
            </div>
          </div>

          <button type="submit" class="btn">เข้าสู่ระบบ</button>
        </form>

        <div class="switch">
          ยังไม่มีบัญชี?
          <a href="register.html" class="link">สมัครสมาชิก</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/auth.js"></script>
</body>
</html>
