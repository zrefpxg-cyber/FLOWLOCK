<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FLOWLOCK | เลือกเกม</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Prompt:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-page="games" data-base=".">
  <header class="top">
    <b>FLOW<span>LOCK</span></b>
    <div class="who"><span id="currentUser">ผู้ใช้</span><a href="app.html" class="hlink">แอป</a><a href="friends.html" class="hlink">เพื่อน</a><button id="logoutBtn" class="out" type="button">ออกจากระบบ</button></div>
  </header>
  <main class="games-shell">
    <section class="games-heading"><p class="eyebrow">JOIN A ROOM</p><h1>เข้าร่วมห้องเกม</h1><p>กรอกรหัส 6 หลักที่เพื่อนส่งให้</p></section>
    <form id="joinGameForm" class="room-join-form">
      <div class="field"><label for="joinGameCode">รหัสห้อง</label><input id="joinGameCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="เช่น 482915" required></div>
      <button class="btn small-btn" type="submit">จอยห้อง</button>
    </form>
    <p id="joinGameMessage" class="msg" aria-live="polite"></p>
    <p class="trade-note">รองรับห้องเล่นปกติเท่านั้น เกมนี้ไม่มีเดิมพันหรือการจ่ายเงิน</p>
  </main>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/games.js"></script>
</body>
</html>
